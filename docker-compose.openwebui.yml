# ═══════════════════════════════════════════════════════════════
# GSTD × Open WebUI — Sovereign AI Chat (No Login)
# Direct access — no authorization required
# Premium models: via GSTD wallet + tokens
# ═══════════════════════════════════════════════════════════════

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: gstd_open_webui
    restart: unless-stopped
    network_mode: host
    environment:
      # ─── Port ───
      - PORT=3100

      # ─── NO AUTH — instant chat access ───
      - WEBUI_AUTH=false
      - ENABLE_SIGNUP=false
      - ENABLE_LOGIN_FORM=false
      - ENABLE_PERSISTENT_CONFIG=false
      - DEFAULT_USER_ROLE=admin

      # ─── Groq API (OpenAI-compatible) ───
      - OPENAI_API_BASE_URL=https://api.groq.com/openai/v1
      - OPENAI_API_KEY=${GROQ_API_KEY:-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}

      # ─── No Ollama ───
      - OLLAMA_BASE_URL=
      - ENABLE_OLLAMA_API=false

      # ─── Branding ───
      - WEBUI_NAME=GSTD Sovereign AI
      - WEBUI_URL=https://chat.gstdtoken.com

      # ─── Security ───
      - WEBUI_SECRET_KEY=ems2VO7R1YZL4JNU_4EhIeRBFEZt1TWN7G04kxv5XU4=

      # ─── Disable unneeded features ───
      - ENABLE_RAG_WEB_SEARCH=false
      - ENABLE_IMAGE_GENERATION=false
      - ENABLE_COMMUNITY_SHARING=false

      # ─── Performance ───
      - AIOHTTP_CLIENT_TIMEOUT=120

      # ─── Auto-create default user on startup ───
      - ADMIN_EMAIL=admin@gstdtoken.com

    volumes:
      - openwebui_data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  openwebui_data:
    driver: local
