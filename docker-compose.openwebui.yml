# ═══════════════════════════════════════════════════════════════
# GSTD × Open WebUI — Sovereign AI Chat Interface
# Connected to Groq API directly (OpenAI-compatible)
# Access via https://chat.gstdtoken.com
# ═══════════════════════════════════════════════════════════════

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: gstd_open_webui
    restart: unless-stopped
    network_mode: host
    environment:
      # ─── Port (host networking) ───
      - PORT=3100

      # ─── Connect DIRECTLY to Groq API (OpenAI-compatible) ───
      - OPENAI_API_BASE_URL=https://api.groq.com/openai/v1
      - OPENAI_API_KEY=${GROQ_API_KEY:-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}

      # ─── Disable Ollama ───
      - OLLAMA_BASE_URL=
      - ENABLE_OLLAMA_API=false

      # ─── Branding ───
      - WEBUI_NAME=GSTD Sovereign AI
      - WEBUI_URL=https://chat.gstdtoken.com

      # ─── Auth ───
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=true
      - DEFAULT_USER_ROLE=user

      # ─── Admin ───
      - WEBUI_SECRET_KEY=${OPENWEBUI_SECRET:-gstd_sovereign_secret_2026}

      # ─── Features ───
      - ENABLE_RAG_WEB_SEARCH=false
      - ENABLE_IMAGE_GENERATION=false
      - ENABLE_COMMUNITY_SHARING=false

      # ─── Performance ───
      - AIOHTTP_CLIENT_TIMEOUT=120

    volumes:
      - openwebui_data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  openwebui_data:
    driver: local
