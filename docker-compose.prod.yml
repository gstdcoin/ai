# GSTD Platform - Production Docker Compose Configuration
# Sovereign AI Infrastructure with Ollama LLM, Blue-Green Deployment
# Last updated: 2026-02-11
services:
  postgres:
    image: postgres:15-alpine
    container_name: gstd_postgres_prod
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-distributed_computing}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c maintenance_work_mem=512MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=300
      -c work_mem=32MB
      -c min_wal_size=2GB
      -c max_wal_size=8GB
      -c max_connections=2000
      -c max_locks_per_transaction=256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    networks:
      - gstd_network

  redis:
    image: redis:7-alpine
    container_name: gstd_redis_prod
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru --save 60 1000 --tcp-keepalive 300
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    networks:
      - gstd_network

  # ====== SOVEREIGN AI ENGINE (Ollama) ======
  # Ollama runs on the host for direct GPU access
  # Install: curl -fsSL https://ollama.com/install.sh | sh
  # Pull models: ollama pull qwen2.5-coder:7b && ollama pull llama3.1:8b
  # Backend connects via OLLAMA_URL env var (defaults to host.docker.internal:11434)

  # ====== BACKEND (Blue-Green Deployment) ======
  backend-blue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gstd-backend:latest
    environment:
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-distributed_computing}
      - DB_HOST=gstd_postgres_prod
      - DB_PORT=5432
      - TON_CONTRACT_ADDRESS=${TON_CONTRACT_ADDRESS}
      - ADMIN_WALLET=${ADMIN_WALLET}
      - GSTD_JETTON_ADDRESS=${GSTD_JETTON_ADDRESS}
      - DB_SSLMODE=disable
      - REDIS_HOST=gstd_redis_prod
      - REDIS_PORT=6379
      - PORT=8080
      - DEPLOYMENT_COLOR=blue
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - gstd_network

  backend-green:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gstd-backend:latest
    environment:
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-distributed_computing}
      - DB_HOST=gstd_postgres_prod
      - DB_PORT=5432
      - TON_CONTRACT_ADDRESS=${TON_CONTRACT_ADDRESS}
      - ADMIN_WALLET=${ADMIN_WALLET}
      - GSTD_JETTON_ADDRESS=${GSTD_JETTON_ADDRESS}
      - DB_SSLMODE=disable
      - REDIS_HOST=gstd_redis_prod
      - REDIS_PORT=6379
      - PORT=8080
      - DEPLOYMENT_COLOR=green
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    networks:
      - gstd_network

  # ====== FRONTEND ======
  frontend:
    image: gstd-frontend:latest
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://app.gstdtoken.com}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://app.gstdtoken.com}
    # depends_on removed: host nginx serves; nginx-lb conflicts on 80/443
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - gstd_network
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # ====== LOAD BALANCER ======
  # Host nginx typically serves 80/443. nginx-lb uses 9080/9443 to avoid conflict.
  # When host nginx is absent, change to "80:80" and "443:443".
  nginx-lb:
    image: nginx:alpine
    container_name: gstd_nginx_lb
    ports:
      - "127.0.0.1:9080:80"
      - "127.0.0.1:9443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/letsencrypt:ro
    depends_on:
      backend-blue:
        condition: service_healthy
      backend-green:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - gstd_network

volumes:
  postgres_data:
  redis_data:

networks:
  gstd_network:
    driver: bridge
