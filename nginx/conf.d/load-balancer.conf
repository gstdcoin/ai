# Load Balancer Configuration for Blue-Green Deployment with API Gateway Support

upstream backend_blue {
    least_conn;
    server backend-blue:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream backend_green {
    least_conn;
    server backend-green:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Active deployment (switch between blue and green)
# Omega Point: max_fails=2 for faster failover; 5xx triggers immediate switch
upstream backend_active {
    least_conn;
    server backend-blue:8080 max_fails=2 fail_timeout=15s weight=100;
    server backend-green:8080 max_fails=2 fail_timeout=15s backup;
    keepalive 32;
}

upstream frontend {
    least_conn;
    server frontend:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Ollama upstream - commented out until Ollama container is deployed
