# gstdbot.gstdtoken.com — GSTD Node OS
# Landing page + Node Dashboard API + install.sh

server {
    listen 443 ssl;
    server_name gstdbot.gstdtoken.com;

    ssl_certificate /etc/letsencrypt/live/app.gstdtoken.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.gstdtoken.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ─── Health ───────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 'ok\n';
    }

    # ─── Node OS API (telegram-bot container = gateway server) ────
    # This serves node status, wallet binding, etc.
    location /api/ {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Bot-Token, X-Wallet-Address' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Bot-Token, X-Wallet-Address';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Route to telegram-bot container (Node OS gateway)
        proxy_pass http://gstd-telegram-bot:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ─── OpenAI-compatible API (/v1/) → telegram-bot container ────
    location /v1/ {
        proxy_pass http://gstd-telegram-bot:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ─── Node OS Dashboard → telegram-bot container ─────────────
    # Full dashboard with wallet, staking, DLN, chat, apps, governance
    location /dashboard {
        proxy_pass http://gstd-telegram-bot:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ─── Node OS static assets ── required for dashboard ──────────
    location /static/ {
        proxy_pass http://gstd-telegram-bot:8080/static/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Telegram Mini App API (/tma/*) → telegram-bot container ──
    location /tma/ {
        proxy_pass http://gstd-telegram-bot:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ─── Telegram Webhook → Go backend ────────────────────────────
    location /webhook {
        proxy_pass http://backend-blue:8080;
        rewrite ^/webhook$ /api/v1/telegram/webhook break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ─── Sovereignty Index → Go backend ───────────────────────────
    location /sovereignty {
        proxy_pass http://backend-blue:8080;
        rewrite ^/sovereignty$ /api/v1/chat/sovereignty-index break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── App Store (proxy to Next.js frontend) ────────────────
    location /appstore {
        proxy_pass http://frontend:3000;
        proxy_set_header Host app.gstdtoken.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ─── Next.js assets (required for proxied pages) ──────────
    location /_next/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host app.gstdtoken.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Static assets for Next.js proxied pages ──────────────
    location /logo.png {
        proxy_pass http://frontend:3000;
        proxy_set_header Host app.gstdtoken.com;
        expires 30d;
    }

    # ─── Install Script (must be before catch-all) ───────────
    location = /install.sh {
        root /var/www/gstdbot;
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ─── Landing Page (static) ────────────────────────────────
    location / {
        root /var/www/gstdbot;
        index index.html;
        try_files $uri $uri/ /index.html;

        # No cache for HTML
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;

        # Cache static assets
        location ~* \.(css|js|png|jpg|svg|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}

# HTTP → HTTPS redirect (with ACME challenge support)
server {
    listen 80;
    server_name gstdbot.gstdtoken.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
