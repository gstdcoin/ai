# ── Rate Limiting Zones ───────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_zone:10m    rate=30r/s;
limit_req_zone $binary_remote_addr zone=chat_zone:10m   rate=5r/s;
limit_req_zone $binary_remote_addr zone=static_zone:10m rate=60r/s;
server_tokens off;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen 80;
    server_name app.gstdtoken.com api.gstdtoken.com;

    location /health {
        access_log off;
        return 200 'healthy\n';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: app.gstdtoken.com ──────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name app.gstdtoken.com;

    # SSL
    ssl_certificate     /etc/letsencrypt/live/app.gstdtoken.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.gstdtoken.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security Headers ──────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self), usb=()" always;

    # ── Frontend ──────────────────────────────────────────────────────────
    location / {
        limit_req zone=static_zone burst=100 nodelay;

        # Security headers (must be repeated inside location due to nginx add_header inheritance)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://app.gstdtoken.com https://api.gstdtoken.com https://toncenter.com https://config.ton.org https://ton.org https://*.ton.org https://bridge.tonapi.io wss://bridge.tonapi.io https://tonapi.io https://*.tonapi.io wss://app.gstdtoken.com https://*.tonconnect.io wss://*.tonconnect.io https://*.ston.fi https://*.dedust.io https://api.mainnet-beta.solana.com https://*.solana.com https://s1.ripple.com https://s2.ripple.com https://xrplcluster.com https://*.xrpl.org https://api-v3.raydium.io https://*.raydium.io https://xumm.app https://*.xumm.app wss://xumm.app https://*.walletconnect.com wss://*.walletconnect.com https://*.walletconnect.org wss://*.walletconnect.org; frame-src 'self' https://*.tonconnect.io https://xumm.app;" always;

        set $frontend "http://frontend:3000";
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }


    # ── Chat Neural Router → Next.js (Groq AI) ───────────────────────────
    location = /api/chat {
        limit_req zone=chat_zone burst=10 nodelay;

        set $frontend "http://frontend:3000";
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        # SSE streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # ── MCP/A2A Agent Discovery ───────────────────────────────────────
    location /.well-known/agent.json {
        set $backend "http://backend-blue:8080";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
    }

    # ── Backend API ───────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_zone burst=50 nodelay;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://app.gstdtoken.com';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Session-Token,X-API-Key,X-Admin-API-Key,X-Wallet-Address';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' 'https://app.gstdtoken.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Session-Token,X-API-Key,X-Admin-API-Key,X-Wallet-Address' always;

        set $backend "http://backend-blue:8080";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # ── AI / OpenAI-compatible (MoA needs 120s) ───────────────────────────
    location /v1/ {
        limit_req zone=chat_zone burst=10 nodelay;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,Content-Type,Authorization' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Content-Length' 0;
            return 204;
        }

        set $backend "http://backend-blue:8080";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        chunked_transfer_encoding on;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ── WebSocket ─────────────────────────────────────────────────────────
    location /ws {
        set $backend "http://backend-blue:8080";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Telegram Mini App (Mobile Node) ────────────────────────────────────
    location /tma {
        # TMA needs to be embeddable in Telegram iframe
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://telegram.org; connect-src 'self' https://app.gstdtoken.com https://api.gstdtoken.com; img-src 'self' data: https:; frame-ancestors 'self' https://web.telegram.org https://t.me;" always;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type,X-TMA-Init-Data' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type,X-TMA-Init-Data';
            return 204;
        }

        set $bot "http://gstd-telegram-bot:8080";
        proxy_pass $bot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        access_log off;
        return 200 'healthy\n';
    }
}

# ── HTTPS: api.gstdtoken.com ──────────────────────────────────────────────
