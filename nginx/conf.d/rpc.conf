server {
    listen 80;
    server_name rpc.gstdtoken.com rpc.gstd.network;

    # Basic Let's Encrypt validation could be added here if not using wildcard elsewhere
    
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name rpc.gstdtoken.com rpc.gstd.network;

    ssl_certificate /etc/nginx/ssl/live/app.gstdtoken.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/app.gstdtoken.com/privkey.pem;

    location /v1/ {
        set $backend "http://backend-blue:8080";
        proxy_pass $backend/rpc/v1/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        
        # CORS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'POST, GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'X-API-Key, Authorization, Content-Type' always;
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }
}
