# ═══════════════════════════════════════════════════════════════
# chat.gstdtoken.com — GSTD × Open WebUI (Sovereign AI Chat)
# Open WebUI at port 3100 (host network)
# Open WebUI connects to GSTD Backend internally via localhost:8080
# ═══════════════════════════════════════════════════════════════

server {
    listen 443 ssl;
    server_name chat.gstdtoken.com;

    ssl_certificate /etc/letsencrypt/live/app.gstdtoken.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.gstdtoken.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL_CHAT:5m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /health {
        access_log off;
        return 200 'healthy\n';
    }

    # ─── Everything → Open WebUI ──────────────────────────────
    # Open WebUI handles all routes internally:
    #   /           - Main UI (SvelteKit)
    #   /api/*      - Open WebUI internal API (auth, config, models, chats)
    #   /ollama/*   - Ollama proxy (disabled)
    #   /openai/*   - OpenAI proxy → GSTD Backend via OPENAI_API_BASE_URL
    location / {
        set $openwebui "http://172.18.0.1:3100";
        proxy_pass $openwebui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Allow large uploads (RAG documents, images)
        client_max_body_size 50m;

        # SSE & WebSocket: disable buffering for streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long timeouts for AI responses and WebSocket
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

# HTTP redirect to HTTPS
server {
    listen 80;
    server_name chat.gstdtoken.com;
    return 301 https://$host$request_uri;
}
