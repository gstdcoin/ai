version: '3.8'

services:
  watchtower:
    image: containrrr/watchtower
    container_name: gstd_watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_API_VERSION=1.45
      - WATCHTOWER_NOTIFICATIONS=shoutrrr
      - WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_NOTIFICATION_URL:-}
    command: --interval 3600 --cleanup --label-enable
    restart: always
    networks:
      - gstd_network

  vector:
    image: timberio/vector:latest-alpine
    container_name: gstd_vector
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector/vector.toml:/etc/vector/vector.toml:ro
    depends_on:
      - n8n
    restart: always
    networks:
      - gstd_network

  ollama:
    image: ollama/ollama:latest
    container_name: gstd_ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: always
    deploy:
      resources:
        limits:
          memory: 6G
    networks:
      - gstd_network

  agent:
    build:
      context: ../A2A
      dockerfile: Dockerfile
    image: gstd_agent_image
    container_name: gstd_agent
    volumes:
      - gstd_agent_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    environment:
      - GSTD_API_URL=${GSTD_API_URL:-https://app.gstdtoken.com}
      - GSTD_API_KEY=${GSTD_API_KEY:-}
      - GSTD_WALLET_PATH=/data/.gstd/wallet.json
      - GSTD_VERBOSE=true
    restart: always
    networks:
      - gstd_network

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    image: gstd_bot_image
    container_name: gstd_bot
    env_file:
      - ../.env
    working_dir: /app
    volumes:
      - ./bot:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - ../backend:/home/ubuntu/backend
      - ./proposals:/home/ubuntu/autonomy/proposals
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_ID=${TELEGRAM_CHAT_ID}
      - OLLAMA_HOST=http://gstd_ollama:11434
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - API_URL=http://ubuntu-backend-blue-1:8080
      - BOT_API_KEY=${BOT_API_KEY:-${TELEGRAM_BOT_TOKEN}}
    command: sh -c "go mod tidy && go run main.go"
    restart: always
    networks:
      - gstd_network

  n8n:
    image: n8nio/n8n:latest
    container_name: gstd_n8n
    env_file:
      - ../.env
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n.gstdtoken.com
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.gstdtoken.com/
      - OLLAMA_HOST=http://gstd_ollama:11434
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/backend:/data/backend:ro
      - /home/ubuntu/autonomy/proposals:/data/proposals
    networks:
      - gstd_network

networks:
  gstd_network:
    external: true
    name: ubuntu_gstd_network

volumes:
  n8n_data:
  ollama_data:
  gstd_agent_data:
