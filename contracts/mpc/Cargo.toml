[package]
name = "gstd-mpc-node"
version = "0.1.0"
edition = "2021"

[dependencies]
threshold_crypto = "0.4.0"
tokio = { version = "1.32", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4.3"
rand = "0.8.5"
warp = "0.3.5"
reqwest = { version = "0.11", features = ["json"] }
