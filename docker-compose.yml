# GSTD Platform — Docker Compose Production

# GSTD Platform — Docker Compose
# Usage: docker compose up -d --build
# Scaling: docker compose up -d --scale backend-blue=4

x-backend-env: &backend-env
  env_file: ./backend/.env

services:
  # ─── PostgreSQL ───────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: gstd_postgres_prod
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: distributed_computing
      # Required — no weak default (set in .env next to this file)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # POSTGRES_HOST_AUTH_METHOD removed — password required
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gstd_network

  # ─── Redis ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gstd_redis_prod
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    # Password interpolated at `docker compose` time from .env (keep .env out of git)
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - gstd_network

  # ─── Backend (Go) ─── Blue-Green, 4 instances ─
  backend-blue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gstd-backend-blue:v198
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Docker socket: only if backend must spawn/manage containers (NaaS). Remove in hardened deployments.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # SECURITY: do not bind-mount the full host repo (removed). For local dev bind-mounts, use docker-compose.override.yml
    deploy:
      replicas: 4
    networks:
      - gstd_network

  # ─── Telegram Bot ─────────────────────────────
  # Handles TG messages, webhooks, mini-app API.
  # NaaS blockchain containers are for remote user nodes only.
  telegram-bot:
    image: gstd-bot:v36
    container_name: gstd-telegram-bot
    restart: unless-stopped
    env_file: ./gstdbot/.env
    depends_on:
      - backend-blue
    networks:
      - gstd_network

  # ─── Frontend (Next.js) ───────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.web
    image: gstd-frontend:v28
    restart: unless-stopped
    env_file: ./frontend/.env
    depends_on:
      - backend-blue
    hostname: frontend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://frontend:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - gstd_network

  # ─── GSTD Bridge (Rust) ────────────────────────
  bridge:
    build:
      context: ./gstd-bridge
      dockerfile: Dockerfile
    image: gstd-bridge:latest
    container_name: gstd-bridge-test
    restart: unless-stopped
    depends_on:
      - backend-blue
    networks:
      - gstd_network

  # ─── Nginx Load Balancer ──────────────────────
  nginx:
    image: nginx:alpine
    container_name: gstd_nginx_lb
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./gstdbot/web:/var/www/gstdbot:ro
      - ./chat-ui:/var/www/chat:ro
    depends_on:
      - backend-blue
      - frontend
    networks:
      - gstd_network

volumes:
  postgres_data:

networks:
  gstd_network:
    name: ubuntu_gstd_network
    driver: bridge
