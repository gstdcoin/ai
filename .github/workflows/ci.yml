# ============================================================================
# GSTD Platform CI — frontend and API checks
# ============================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:  # allow manual checks from GitHub UI

jobs:
  # ── TypeScript + ESLint + Build ─────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    name: Frontend
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL || 'https://placeholder.upstash.io' }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN || 'placeholder' }}
          NEXT_PUBLIC_APP_URL: https://app.gstdtoken.com

  # ── Cloudflare Workers deployment ──────────────────────────────────────
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare
    needs: frontend
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Cloudflare Worker
        run: npm run cf:build
        env:
          KV_REST_API_URL: https://placeholder.upstash.io
          KV_REST_API_TOKEN: placeholder
          NEXT_PUBLIC_APP_URL: https://app.gstdtoken.com
          NEXT_PUBLIC_API_URL: https://app.gstdtoken.com

      - name: Validate deployment secrets
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$KV_REST_API_URL" || { echo "::error::Missing KV_REST_API_URL"; exit 1; }
          test -n "$KV_REST_API_TOKEN" || { echo "::error::Missing KV_REST_API_TOKEN"; exit 1; }
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}

      - name: Verify Upstash connectivity
        run: |
          node --input-type=module -e '
            import { Redis } from "@upstash/redis/cloudflare";
            try {
              const redis = new Redis({
                url: process.env.KV_REST_API_URL,
                token: process.env.KV_REST_API_TOKEN
              });
              const response = await redis.ping();
              if (response !== "PONG") throw new Error("Unexpected ping response");
              await redis.get("health:ping");
              console.log("Upstash REST PING and GET succeeded");
            } catch (error) {
              const status = Number.isInteger(error?.status) ? ` (HTTP ${error.status})` : "";
              const type = error instanceof Error ? ` (${error.name})` : "";
              console.error(`Upstash REST health probe failed${type}${status}; verify the configured database credentials and availability.`);
              process.exit(1);
            }
          '
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}

      - name: Bootstrap preview Worker
        id: bootstrap
        run: |
          set -o pipefail
          OPEN_NEXT_DEPLOY=true npx wrangler deploy --config wrangler.jsonc 2>&1 | tee "$RUNNER_TEMP/wrangler-bootstrap.log"
          worker_url="$(grep -Eo 'https://[[:alnum:].-]+\.workers\.dev' "$RUNNER_TEMP/wrangler-bootstrap.log" | tail -n 1 || true)"
          if [ -z "$worker_url" ]; then
            echo "::error::Wrangler did not report a workers.dev URL"
            exit 1
          fi
          echo "url=$worker_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Configure Upstash runtime secrets
        run: |
          printf '%s' "$KV_REST_API_URL" | npx wrangler secret put KV_REST_API_URL --config=wrangler.jsonc
          printf '%s' "$KV_REST_API_TOKEN" | npx wrangler secret put KV_REST_API_TOKEN --config=wrangler.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}

      - name: Deploy preview and populate prerender cache
        run: npm run cf:deploy -- --config=wrangler.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify preview health
        run: |
          for attempt in $(seq 1 12); do
            status="$(curl --silent --output "$RUNNER_TEMP/health.json" --write-out '%{http_code}' "$WORKER_URL/api/v1/health" || true)"
            if [ "$status" = "200" ]; then
              cat "$RUNNER_TEMP/health.json"
              exit 0
            fi
            echo "Preview health returned HTTP ${status:-000}; retry $attempt/12"
            sleep 5
          done
          echo "::error::Preview health did not return HTTP 200"
          cat "$RUNNER_TEMP/health.json" || true
          exit 1
        env:
          WORKER_URL: ${{ steps.bootstrap.outputs.url }}

      - name: Verify preview pages
        run: |
          set -euo pipefail
          tail_log="$RUNNER_TEMP/worker-tail.jsonl"
          npx wrangler tail gstd-ai-platform --config wrangler.jsonc --format json --header x-gstd-page-smoke > "$tail_log" 2>&1 &
          tail_pid=$!
          sleep 5
          if ! kill -0 "$tail_pid" 2>/dev/null; then
            echo "::warning::Worker Tail did not stay connected; check the Workers Tail Read token permission"
          fi

          failed=0
          index=0
          for path in / /en /ru /en/stats /en/network; do
            index=$((index + 1))
            body="$RUNNER_TEMP/page-${index}.html"
            status="$(curl --silent --show-error --location --max-time 30 --header 'x-gstd-page-smoke: ci' --output "$body" --write-out '%{http_code}' "$WORKER_URL$path" || true)"
            if [ "$status" != "200" ] || ! grep -iq '<!doctype html' "$body"; then
              echo "::error::Preview page $path returned HTTP ${status:-000} or non-HTML content"
              failed=1
            else
              echo "Preview page $path returned HTTP 200"
            fi
          done
          sleep 2
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true

          node - "$tail_log" <<'NODE'
          const fs = require('fs');
          const logPath = process.argv[2];
          const secretValues = [
            process.env.CLOUDFLARE_API_TOKEN,
          ].filter(Boolean);
          const details = [];
          let invocationCount = 0;
          let invalidLines = 0;

          for (const line of fs.readFileSync(logPath, 'utf8').split(/\r?\n/)) {
            const jsonStart = line.indexOf('{');
            if (jsonStart < 0) continue;
            try {
              const event = JSON.parse(line.slice(jsonStart));
              if (event.event?.request) invocationCount += 1;
              for (const exception of event.exceptions ?? []) {
                let message = String(exception.message ?? '');
                for (const secret of secretValues) message = message.replaceAll(secret, '[redacted]');
                message = message
                  .replace(/https?:\/\/[^\s"'<>]+/gi, '[url]')
                  .replace(/[\r\n\t]/g, ' ')
                  .slice(0, 240);
                details.push(`${String(exception.name ?? 'Error').slice(0, 80)}: ${message}`);
              }
              for (const log of event.logs ?? []) {
                if (log.level !== 'error') continue;
                const values = Array.isArray(log.message) ? log.message : [log.message];
                let message = values
                  .map((value) => typeof value === 'string' ? value : JSON.stringify(value))
                  .join(' ');
                for (const secret of secretValues) message = message.replaceAll(secret, '[redacted]');
                message = message
                  .replace(/https?:\/\/[^\s"'<>]+/gi, '[url]')
                  .replace(/[\r\n\t]/g, ' ')
                  .slice(0, 240);
                details.push(`Worker log: ${message}`);
              }
            } catch (error) {
              if (!(error instanceof SyntaxError)) throw error;
              invalidLines += 1;
            }
          }

          const summaryLines = details.length
            ? ['### Preview Worker errors (redacted)', '', ...details.map((value) => `- ${value}`)]
            : [invocationCount > 0
              ? `Worker Tail captured ${invocationCount} matching request event(s), but no exceptions or error logs.`
              : 'Worker Tail captured no matching request events.'];
          if (invalidLines > 0) summaryLines.push(`Skipped ${invalidLines} non-JSON tail output line(s).`);
          const summary = `${summaryLines.join('\n')}\n`;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          for (const detail of [...new Set(details)].slice(0, 10)) {
            const annotation = detail.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
            process.stdout.write(`::error title=Preview Worker::${annotation}\n`);
          }
          if (details.length === 0) {
            const message = invocationCount > 0
              ? `Tail captured ${invocationCount} matching request event(s) without errors.`
              : 'Tail captured no matching request events; check permission and header filter.';
            process.stdout.write(`::warning title=Preview Worker::${message}\n`);
          }
          console.log(`Captured ${invocationCount} request event(s) and ${details.length} filtered Worker error detail(s).`);
          NODE

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
        env:
          WORKER_URL: ${{ steps.bootstrap.outputs.url }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy production route
        run: npm run cf:deploy -- --config=wrangler.production.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify production health
        run: |
          for attempt in $(seq 1 12); do
            status="$(curl --silent --output "$RUNNER_TEMP/production-health.json" --write-out '%{http_code}' https://app.gstdtoken.com/api/v1/health || true)"
            if [ "$status" = "200" ]; then
              cat "$RUNNER_TEMP/production-health.json"
              exit 0
            fi
            echo "Production health returned HTTP ${status:-000}; retry $attempt/12"
            sleep 5
          done
          echo "::error::Production health did not return HTTP 200"
          cat "$RUNNER_TEMP/production-health.json" || true
          exit 1

  # ── Dependency Security Audit ──────────────────────────────────────────
  audit:
    runs-on: ubuntu-latest
    name: Security Audit
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Audit (high+critical only)
        run: npm audit --audit-level=high || true
