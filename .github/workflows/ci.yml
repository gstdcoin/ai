# ============================================================================
# GSTD Platform CI — Frontend-only (Vercel serverless, no Go backend)
# ============================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── TypeScript + ESLint + Build ─────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    name: Frontend
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL || 'https://placeholder.upstash.io' }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN || 'placeholder' }}
          NEXT_PUBLIC_APP_URL: https://app.gstdtoken.com

  # ── Dependency Security Audit ──────────────────────────────────────────
  audit:
    runs-on: ubuntu-latest
    name: Security Audit
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Audit (high+critical only)
        run: npm audit --audit-level=high || true
