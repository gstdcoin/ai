# ============================================================================
# GSTD Platform CI — Frontend-only (Vercel serverless, no Go backend)
# ============================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:  # allow manual deploy from GitHub UI

jobs:
  # ── TypeScript + ESLint + Build ─────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    name: Frontend
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL || 'https://placeholder.upstash.io' }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN || 'placeholder' }}
          NEXT_PUBLIC_APP_URL: https://app.gstdtoken.com

  # ── Deploy to Vercel (production) ─────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: frontend
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_nJrl4HPx1kF1r635js1KE2qd
      VERCEL_PROJECT_ID: prj_j2gQqRULHdMowbDHZt7wSqs2z3Bf
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to production
        run: vercel deploy --prod --yes --token "$VERCEL_TOKEN"

  # ── Dependency Security Audit ──────────────────────────────────────────
  audit:
    runs-on: ubuntu-latest
    name: Security Audit
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Audit (high+critical only)
        run: npm audit --audit-level=high || true
